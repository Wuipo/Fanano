name: db-migrate

# Applica le migration del database su Supabase a ogni push che tocca
# supabase/migrations/. Gira in parallelo al deploy del codice su Vercel.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: acqrjpkroqquyzbeivyw
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link al progetto Supabase
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Applica le migration
        run: supabase db push
